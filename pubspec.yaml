publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  shared_preferences: ^2.3.2
  flutter_screenutil_plus: ^1.5.0
  go_router: ^18.0.1
