  dartz: ^0.10.1
  flutter_secure_storage: ^11.1.1
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
