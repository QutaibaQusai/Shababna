# Config for the flutter_native_splash package.
# Run after editing: dart run flutter_native_splash:create --path=flutter_native_splash.yaml
# The generator drops android:screenOrientation="portrait" from
# AndroidManifest.xml; restore that line after running it.
#
# Brand splash: the whole screen is the app primary color (AppColors.primaryColor)
# with the RHAS heart in the middle, the same in light and dark mode.
#
# One image everywhere: assets/branding/splash_logo.png is a 1152x1152
# transparent canvas with the logo's heart cut out, 520px wide, in the middle.
# Android 12+'s SplashScreen API masks the icon to a 768px circle in the middle
# of that canvas (https://pub.dev/packages/flutter_native_splash), and the heart
# stays inside it. On older Android and iOS the image is treated as 4x, so the
# heart shows at about 130dp.
flutter_native_splash:
  color: "#004C96"
  image: assets/branding/splash_logo.png

  android_12:
    color: "#004C96"
    image: assets/branding/splash_logo.png

  android: true
  ios: true
  web: false
