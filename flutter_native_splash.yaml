# Config for the flutter_native_splash package.
# Run after editing: dart run flutter_native_splash:create --path=flutter_native_splash.yaml
#
# Single state only (no light/dark split): primary-blue background with the
# white wordmark, alpha-matted (transparent background) recolor of
# assets/images/logo.png - kept as one fixed brand look regardless of the
# device's system theme.
#
# logo_splash.png: full-size centered image used for the legacy
# (pre-Android-12) splash screen, which has no size constraint.
#
# logo_android12.png: a SEPARATE, smaller render for Android 12+'s native
# SplashScreen API, which masks the icon to a circle - content must fit
# within a 192dp safe zone inside a 288dp canvas
# (https://developer.android.com/develop/ui/views/launch/splash-screen). The
# wordmark is wide/short, so reusing the full-size splash image here would
# have its outer strokes clipped by that circular mask.
flutter_native_splash:
  color: "#004C96"
  image: assets/images/logo_splash.png

  android_12:
    color: "#004C96"
    image: assets/images/logo_android12.png

  android: true
  ios: true
  web: false
