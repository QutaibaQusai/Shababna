# Config for the flutter_native_splash package.
# Run after editing: dart run flutter_native_splash:create --path=flutter_native_splash.yaml
# The generator drops android:screenOrientation="portrait" from
# AndroidManifest.xml; restore that line after running it.
#
# Light and dark follow the device theme. The background colors match the app
# theme scaffold backgrounds (AppColors.backgroundLight / backgroundDark), so
# the splash hands over to the first screen without a color flash. The
# light-blue association heart reads well on both.
#
# One image everywhere: splash_logo.png is a 1152x1152 transparent canvas with
# the heart 560px wide in the middle. Android 12+'s SplashScreen API masks the
# icon to a circle about two-thirds of the canvas
# (https://developer.android.com/develop/ui/views/launch/splash-screen), and
# the heart's corners stay inside it. On older Android and iOS the package
# treats the image as 4x (xxxhdpi), so the heart shows at about 140dp.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  color_dark: "#0B1014"
  image_dark: assets/images/splash_logo.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_logo.png
    color_dark: "#0B1014"
    image_dark: assets/images/splash_logo.png

  android: true
  ios: true
  web: false
