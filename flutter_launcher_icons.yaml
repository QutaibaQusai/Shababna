flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true

  # Standard icon (used as fallback and for older Android), and base for iOS
  image_path: "assets/images/logo_heart_icon.png"

  # Android adaptive icon (API 26+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_heart_foreground.png"
